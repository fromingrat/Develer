
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velform — Product Connection Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    button {
      padding: 12px 18px;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f3f3f3;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>VELFORM</h1>
  <h2>Firestore Product Test</h2>
  <p>This page checks whether published products can be read.</p>

  <button id="test-button" type="button">Test connection</button>
  <pre id="result">Ready to test.</pre>

  <script type="module">
    import { getPublishedProducts } from "./product-service.js";

    const button = document.getElementById("test-button");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "Connecting to Firestore...";

      try {
        const products = await getPublishedProducts();

        result.textContent = products.length
          ? JSON.stringify(products, null, 2)
          : "Connection successful, but no published products were found. Add a test product with published: true.";

      } catch (error) {
        console.error(error);
        result.textContent =
          "Connection failed: " + error.code + "\n" + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
